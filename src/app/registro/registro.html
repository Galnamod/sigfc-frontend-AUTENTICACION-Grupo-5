<div class="registro-full-bg">
  <div class="registro-card-split">
    
    <div class="side-form-content">
      
      <div class="header-uni">
        <div class="logo-placeholder">
          <img src="img/Logo-uni.png" alt="Logo UNI" class="logo-uni">
        </div> 
        <div class="header-titles">
          <p class="institucion">UNIVERSIDAD NACIONAL DE INGENIERÍA</p>
          <p class="sistema">Sistema de Gestión de<br>Proyectos de Investigación</p>
        </div>
      </div>

      <h2 class="titulo-registro">Registrate</h2>
      
      <div class="form-grid">
        <div class="input-group">
          <label>Correo Universitario</label>
          <input type="email" placeholder="Ingresa tu correo Uni">
        </div>

        <div class="input-group">
          <label>DNI</label>
          <input type="text" placeholder="Dni">
        </div>

        <div class="input-group">
          <label>Primer nombre</label>
          <input type="text" placeholder="Ingresa tu primer nombre">
        </div>

        <div class="input-group">
          <label>Apellido Paterno</label>
          <input type="text" placeholder="Ingresa tu apellido paterno">
        </div>

        <div class="input-group">
          <label>Apellido Materno</label>
          <input type="text" placeholder="Ingresa tu apellido Materno">
        </div>

        <div class="input-group">
          <label>Código UNI</label>
          <input type="text" placeholder="Ingresa tu código">
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" placeholder="Ingresa tu Contraseña">
        </div>

        <div class="input-group">
          <label>Confirmar Contraseña</label>
          <input type="password" placeholder="Ingresa tu Contraseña">
        </div>
      </div>

      <button class="btn-crear" routerLink="/registro-exitoso">Crear Cuenta</button>

      <p class="login-link">
        ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión ahora</a>
      </p>

    </div>

    <div class="side-image">
      </div>

  </div>
</div>
