<div class="container-principal">
  <div class="tarjeta-blanca">
    
    <div class="cabecera-uni">
      <img src="img/Logo-uni.png" alt="Logo UNI" class="logo-institucional">
      <div class="textos-cabecera">
        <p class="nombre-uni">UNIVERSIDAD NACIONAL DE INGENIERÍA</p>
        <p class="nombre-sistema">Sistema de Gestión de Proyectos de Investigación</p>
      </div>
    </div>

    <h2 class="titulo-seccion">Restablecer contraseña</h2>
    
    <div class="grupo-input">
      <label>Nueva contraseña</label>
      <input type="password" placeholder="Mínimo 8 caracteres">
    </div>

    <div class="grupo-input">
      <label>Confirmar nueva contraseña</label>
      <input type="password" placeholder="Repite tu contraseña">
    </div>

    <button class="btn-primario" routerLink="/Restablecer">Cambiar contraseña</button>

    <p class="enlace-retorno">
      <a routerLink="/login">Cancelar y volver</a>
    </p>

  </div>
</div>
